name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  governance:
    name: Repository structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify required governance files
        run: |
          test -f README.md
          test -f CONTRIBUTING.md
          test -f CHANGELOG.md
          test -f LICENSE
          test -f .github/CODEOWNERS
          test -f .github/pull_request_template.md
          test -d .github/ISSUE_TEMPLATE
          test -f .github/ISSUE_TEMPLATE/bug.md
          test -f .github/ISSUE_TEMPLATE/chore.md

      - name: Verify internal planning is not committed
        run: |
          if git ls-files idea/ | grep -q .; then
            echo "error: idea/ must not be tracked in git"
            git ls-files idea/
            exit 1
          fi

      - name: Verify application layout
        run: |
          test -f rank.py
          test -d src
          test -d tests

  lint:
    name: lint
    runs-on: ubuntu-latest
    needs: governance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest tests/ -v
        env:
          AVERA_SKIP_SEMANTIC: "1"
      - run: python rank.py --health

  security:
    name: security
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: bandit -r src/ -ll
      - run: pip-audit -r requirements.txt

  integration:
    name: integration
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python rank.py --candidates tests/fixtures/sample.jsonl --limit 1 --out ci_submission.csv
        env:
          AVERA_SKIP_SEMANTIC: "1"
      - name: Smoke-check submission shape
        run: |
          python -c "
          import csv
          from pathlib import Path
          rows = list(csv.reader(Path('ci_submission.csv').open(encoding='utf-8')))
          assert rows[0] == ['candidate_id', 'rank', 'score', 'reasoning'], rows[0]
          assert len(rows) >= 2, 'expected header plus at least one data row'
          "
      - run: python scripts/test_generalization.py
        env:
          AVERA_SKIP_SEMANTIC: "1"

  mypy:
    name: mypy
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt mypy
      - run: mypy src rank.py

  docker-smoke:
    name: docker-smoke
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build avera-cli
      - run: docker compose run --rm avera-cli python rank.py --health
