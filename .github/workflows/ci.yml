name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  governance:
    name: Repository structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify required governance files
        run: |
          test -f README.md
          test -f CONTRIBUTING.md
          test -f CHANGELOG.md
          test -f LICENSE
          test -f .github/CODEOWNERS
          test -f .github/pull_request_template.md
          test -d .github/ISSUE_TEMPLATE
          test -f .github/ISSUE_TEMPLATE/bug.md
          test -f .github/ISSUE_TEMPLATE/chore.md

      - name: Verify internal planning is not committed
        run: |
          if git ls-files idea/ | grep -q .; then
            echo "error: idea/ must not be tracked in git"
            git ls-files idea/
            exit 1
          fi

      - name: Verify application layout
        run: |
          test -f rank.py
          test -d src
          test -d tests

  lint:
    name: lint
    runs-on: ubuntu-latest
    needs: governance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest tests/ -v
      - run: python rank.py --health

  security:
    name: security
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: bandit -r src/ -ll
      - run: pip-audit -r requirements.txt

  integration:
    name: integration
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python rank.py --candidates tests/fixtures/sample.jsonl --limit 5 --out ci_submission.csv
      - run: python DataSet/validate_submission.py ci_submission.csv
