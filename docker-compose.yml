version: "3.8"

services:
  avera-sandbox:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "7860:7860"
    volumes:
      - ./DataSet:/app/DataSet:ro
    environment:
      - PYTHONUNBUFFERED=1
      - AVERA_SEMANTIC_MODEL=/app/models/all-MiniLM-L6-v2
      - AVERA_SANDBOX_DIR=/app/.sandbox
    command: ["python", "app.py"]

  avera-cli:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./DataSet:/app/DataSet:ro
      - ./:/app/output
    environment:
      - PYTHONUNBUFFERED=1
      - AVERA_SEMANTIC_MODEL=/app/models/all-MiniLM-L6-v2
    command:
      [
        "python",
        "rank.py",
        "--candidates",
        "DataSet/candidates.jsonl",
        "--out",
        "output/submission.csv",
      ]
