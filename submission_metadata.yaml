ai_usage_summary: |
  Used Gemini for architecture planning, scoring logic ideation, and code review. No candidate data was fed to any LLM.

methodology_summary: |
  Hybrid semantic & deterministic ranker using a dual-role approach (AI Engineer × DevOps). 
  Stage 1 drops 59.7% fictional companies. Stage 1.5 drops ~1,603 subtle honeypot traps on the remainder. 
  Stage 2 computes a base score across 5 features (title_career 35%, skills 25%, experience 15%, location 10%, semantic 15%). 
  The Semantic scorer uses sentence-transformers (all-MiniLM-L6-v2) for deep contextual matching against the JD.
  Experience specifically targets ML/AI tenure. Location strictly prefers the 4 JD-named cities.
  Stage 3 applies a multiplicative behavioral modifier based on GitHub activity, search visibility, offer acceptance, interview completion, and profile verifications, scaled between 0.4 and 1.3. 
  Final rank runs in < 5 mins via min-heap. Semantic model (all-MiniLM-L6-v2) is pre-cached locally; set AVERA_SEMANTIC_MODEL for offline runs. Outputs defusedcsv, sandboxed via Docker and HuggingFace Spaces.

declarations:
  read_submission_spec: true
  code_is_original_work: true
  no_collusion: true
  honeypot_check_done: true
  reproduction_tested: true
