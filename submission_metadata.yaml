ai_usage_summary: |
  Used Gemini and Claude/Cursor for architecture planning, review synthesis, scoring logic ideation, and code review. No candidate data was fed to any LLM.

methodology_summary: |
  Hybrid semantic and deterministic ranker for Redrob Track 1 (Intelligent Candidate Discovery).
  Stage 1 drops fictional companies; Stage 1.5 drops honeypots (including multi-domain expert traps).
  Stage 2 computes a base score across 7 scorers with seniority-aware weights (semantic 27%, title/career 18%, trajectory 16%, skills 14%, experience 11%, education 8%, location 6%).
  JD domain branches title and skill taxonomies (ai_ml, devops, generic).
  Semantic funnel: heuristic gate then sentence-transformers (all-MiniLM-L6-v2) on top-K; cross-encoder min-max rerank on shortlist pool (ADR-018).
  Stage 3 applies behavioral multiplier (0.4x-1.3x). Join probability (informational, XLSX column) uses India hireability signals without affecting rank.
  Full 100K run: `make download-model && python rank.py --candidates DataSet/candidates.jsonl --out submission.csv`.
  Eval: `python scripts/eval.py` (honeypot rate, NDCG@10, Precision@5/10, Recovery@10).

declarations:
  read_submission_spec: true
  code_is_original_work: true
  no_collusion: true
  honeypot_check_done: true
  reproduction_tested: true
