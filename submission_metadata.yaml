ai_usage_summary: |
  Used Gemini and Claude/Cursor for architecture planning, review synthesis, scoring logic ideation, and code review. No candidate data was fed to any LLM.

methodology_summary: |
  Hybrid semantic and deterministic ranker for India Runs / Redrob Track 1 (Intelligent Candidate Discovery).
  Stage 1 drops fictional companies; Stage 1.5 drops honeypots (5 methods: title/skill mismatch, expert-with-zero-months, impossible seniority, multi-domain expert trap, unverified generalist).
  Stage 2 computes a base score across 7 scorers with seniority-aware weights (semantic 27%, title/career 18%, trajectory 16%, skills 14%, experience 11%, education 8%, location 6%).
  Skills scorer uses synonym expansion, adjacency graph, and recency-weighted skill matching; location scorer boosts remote/hybrid.
  JD domain branches title and skill taxonomies (ai_ml, devops, generic).
  Semantic funnel: heuristic gate (>= 0.11) then all-MiniLM-L6-v2 on top-K; cross-encoder (ms-marco-MiniLM-L-6-v2) min-max rerank on shortlist pool — no sigmoid (ADR-018).
  Stage 3 applies behavioral multiplier (0.4x-1.3x). Join probability (informational, XLSX column) uses India hireability signals without affecting rank.
  Output: submission.csv (candidate_id, rank, score, reasoning); submission.xlsx adds join_probability.
  Pre-download both models: `make download-model`. Full 100K run: `python rank.py --candidates DataSet/candidates.jsonl --out submission.csv`.
  Quality gates: 81 pytest tests; honeypot rate 0 in top-100 on full pool; eval via `python scripts/eval.py` (honeypot rate, NDCG@10, Precision@5/10, Recovery@10).

declarations:
  read_submission_spec: true
  code_is_original_work: true
  no_collusion: true
  honeypot_check_done: true
  reproduction_tested: true
