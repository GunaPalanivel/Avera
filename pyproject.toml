[project]
name = "avera"
version = "0.1.0"
description = "Deterministic candidate ranking for Redrob Track 01"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.8,<1",
    "bandit>=1.8,<2",
    "pip-audit>=2.7,<3",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "rank.py"]
extend-exclude = ["DataSet"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
